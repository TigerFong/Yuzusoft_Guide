<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柚子社 · 幻境交錯</title>
    <link rel="stylesheet" href="/static/game/styles.css">
</head>
<body>

    <!-- 遊戲主界面 -->
    <div id="gameContainer" class="game-container" style="display: none;">
        <header class="game-header">
            <div class="header-left">
                <a href="/" class="btn-back">📖 返回攻略站</a>
                <span class="game-logo">柚子社 · 幻境交錯</span>
            </div>
            <div class="header-right">
                <div class="user-coins">
                    <span class="coin-icon"></span>
                    <span id="userCoins">0</span>
                </div>
                <div class="user-info">
                    <span id="userName">玩家</span>
                    <button id="logoutBtn" class="btn-logout">登出</button>
                </div>
            </div>
        </header>

        <main class="game-main">
            <div class="placeholder-panel">
                <h1>系統登入成功</h1>
                <p>抽卡與戰鬥系統將於近期實裝。</p>
            </div>
        </main>
    </div>

    <!-- 登入遮罩 -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <div class="login-header">
                <h1>YUZUSOFT</h1>
                <p>幻境交錯 · 登入</p>
            </div>
            
            <div class="login-tabs">
                <button class="tab-btn active" data-tab="login">登入</button>
                <button class="tab-btn" data-tab="register">註冊</button>
            </div>

            <form id="authForm" class="auth-form">
                <div class="input-group">
                    <input type="text" id="usernameInput" placeholder="用戶名 (1-20字)" required autocomplete="username">
                </div>
                <div class="input-group">
                    <input type="password" id="passwordInput" placeholder="密碼 (至少6位)" required autocomplete="current-password">
                </div>
                
                <div id="authError" class="auth-error"></div>

                <button type="submit" id="submitBtn" class="btn-submit">進 入 幻 境</button>
            </form>
        </div>
    </div>

    <script src="/static/game/script.js"></script>
</body>
</html>
