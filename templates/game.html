<!-- 文件：templates/game.html -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柚子社 · 幻境交錯</title>
    <link rel="stylesheet" href="/static/game/styles.css">
</head>
<body>
    <div id="gameContainer" class="game-container" style="display: none;">
        <header class="game-header">
            <div class="header-left">
                <a href="/" class="btn-back">📖 返回攻略站</a>
                <span class="game-logo">柚子社 · 幻境交錯</span>
                <div class="nav-tabs">
                    <button class="nav-tab" data-view="battle">⚔️ 異界裂縫</button>
                    <button class="nav-tab active" data-view="gacha">✨ 幻境卡池</button>
                    <button class="nav-tab" data-view="roster">🎴 我的角色</button>
                </div>
            </div>
            <div class="header-right">
                <div class="user-coins">
                    <span class="coin-icon"></span>
                    <span id="userCoins">0</span>
                </div>
                <div class="user-info">
                    <span id="userName">玩家</span>
                    <button id="logoutBtn" class="btn-logout">登出</button>
                </div>
            </div>
        </header>

        <main class="game-main">
            <!-- 視圖 1：抽卡 -->
            <div id="gachaView" class="view-panel active">
                <div class="gacha-panel">
                    <div class="gacha-title">常駐幻境卡池</div>
                    <div class="pity-info">距離 SSR 保底：<span id="pityCount" class="highlight">0</span> / 80</div>
                    <div class="gacha-buttons">
                        <button class="btn-draw" id="draw1Btn">
                            <span class="draw-name">單次邂逅</span>
                            <span class="draw-cost">160 柚幣</span>
                        </button>
                        <button class="btn-draw ten" id="draw10Btn">
                            <span class="draw-name">十連邂逅</span>
                            <span class="draw-cost">1,600 柚幣</span>
                        </button>
                    </div>
                    <button class="btn-wishlist" id="openWishlistBtn">⭐ 設定心願單</button>
                </div>
            </div>

            <!-- 視圖 2：角色圖鑑 -->
            <div id="rosterView" class="view-panel">
                <div class="roster-panel">
                    <div class="gacha-title">我的角色</div>
                    <div id="rosterGrid" class="roster-grid"></div>
                </div>
            </div>

            <!-- 視圖 3：戰鬥 -->
            <div id="battleView" class="view-panel">
                <div id="battleContainer" class="battle-container" style="display:none;">
                    <div class="enemy-area" id="enemyArea"></div>
                    <div class="mid-area">
                        <div class="player-party" id="playerParty"></div>
                        <div class="battle-controls">
                            <div class="sp-display">⚡ SP: <span id="spValue">3</span> / 10</div>
                            <button class="btn-end-turn" id="endTurnBtn">結束回合</button>
                        </div>
                    </div>
                    <div class="hand-area" id="handArea"></div>
                </div>
                
                <!-- 選擇關卡入口 -->
                <div id="stageSelect" style="text-align:center; padding: 40px; width: 100%; max-width: 900px; margin: 0 auto;">
                    <h2 style="color:var(--gold-light); margin-bottom:20px; letter-spacing:0.1em;">異界裂縫</h2>
                    
                    <div class="stage-game-tabs">
                        <button class="stage-tab active" data-game="senren">千戀＊萬花</button>
                        <button class="stage-tab" data-game="tenshi">天使紛擾</button>
                        <button class="stage-tab" data-game="cafe">星光咖啡館</button>
                        <button class="stage-tab" data-game="sabbat">魔女的夜宴</button>
                    </div>

                    <div class="stage-list" id="stageList"></div>
                    
                    <div class="party-select-panel" style="margin-top: 30px;">
                        <h3>選擇出戰隊伍（最多 3 名）</h3>
                        <div id="partySelectGrid" class="party-select-grid"></div>
                        <div class="party-select-footer">
                            <span>已選 <span class="count" id="partySelectCount">0</span> / 3</span>
                            <button class="btn-primary" id="enterStageBtn" disabled>請先選擇關卡</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 登入遮罩 (保持不變) -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <div class="login-header"><h1>YUZUSOFT</h1><p>幻境交錯 · 登入</p></div>
            <div class="login-tabs">
                <button class="tab-btn active" data-tab="login">登入</button>
                <button class="tab-btn" data-tab="register">註冊</button>
            </div>
            <form id="authForm" class="auth-form">
                <div class="input-group"><input type="text" id="usernameInput" placeholder="用戶名" required></div>
                <div class="input-group"><input type="password" id="passwordInput" placeholder="密碼" required></div>
                <div id="authError" class="auth-error"></div>
                <button type="submit" id="submitBtn" class="btn-submit">進 入 幻 境</button>
            </form>
        </div>
    </div>

    <!-- 抽卡結果彈窗 -->
    <div id="gachaResultModal" class="modal-overlay">
        <div class="modal-content gacha-result">
            <div id="gachaCards" class="cards-container"></div>
            <button id="closeResultBtn" class="btn-primary">確定</button>
        </div>
    </div>

    <!-- 心願單彈窗 -->
    <div id="wishlistModal" class="modal-overlay">
        <div class="modal-content wishlist-content">
            <h2>設定心願單</h2>
            <p class="wish-desc">抽到 SSR 時，有 67% 機率命中你選的角色</p>
            <div id="wishlistGrid" class="wish-grid"></div>
            <div class="modal-actions">
                <button id="closeWishlistBtn" class="btn-secondary">取消</button>
                <button id="saveWishlistBtn" class="btn-primary">儲存</button>
            </div>
        </div>
    </div>

    <!-- 覺醒彈窗 -->
    <div id="awakenModal" class="modal-overlay">
        <div class="modal-content awaken-content">
            <div class="awaken-header">
                <img id="awakenImg" src="" alt="">
                <div class="awaken-info">
                    <h2 id="awakenName">角色名稱</h2>
                    <div class="awaken-stars" id="awakenRarity">SSR</div>
                    <div class="awaken-shards">持有碎片：<span id="awakenShards">0</span></div>
                </div>
            </div>
            <div class="awaken-levels">
                <div class="awaken-level" id="awakenLvl1"><div class="lvl-title">覺醒 I <span class="lvl-cost">消耗 1 碎片</span></div><p class="lvl-desc"></p></div>
                <div class="awaken-level" id="awakenLvl2"><div class="lvl-title">覺醒 II <span class="lvl-cost">消耗 1 碎片</span></div><p class="lvl-desc"></p></div>
                <div class="awaken-level" id="awakenLvl3"><div class="lvl-title">覺醒 III <span class="lvl-cost">消耗 1 碎片</span></div><p class="lvl-desc"></p></div>
                <div class="awaken-level" id="awakenLvl4"><div class="lvl-title">覺醒 IV <span class="lvl-cost">消耗 1 碎片</span></div><p class="lvl-desc"></p></div>
                <div class="awaken-level" id="awakenLvl5"><div class="lvl-title">覺醒 V <span class="lvl-cost">消耗 1 碎片</span></div><p class="lvl-desc"></p></div>
                <div class="awaken-level" id="awakenLvl6"><div class="lvl-title">覺醒 VI <span class="lvl-cost">消耗 1 碎片</span></div><p class="lvl-desc"></p></div>
            </div>
            <div class="modal-actions">
                <button id="closeAwakenBtn" class="btn-secondary">關閉</button>
                <button id="doAwakenBtn" class="btn-primary">進行覺醒</button>
            </div>
        </div>
    </div>

    <!-- 劇情彈窗 (新增) -->
    <div id="storyModal" class="modal-overlay" style="z-index: 10005;">
        <div class="modal-content" style="width: 600px; background: #000; border: 1px solid var(--gold-main); color: #fff; text-align: left;">
            <h3 style="color: var(--gold-light); margin-bottom: 15px;">劇情簡介</h3>
            <p id="storyText" style="line-height: 1.8; font-size: 15px; margin-bottom: 25px; color: #ccc;"></p>
            <div style="text-align: right;">
                <button id="closeStoryBtn" class="btn-primary">開始戰鬥</button>
            </div>
        </div>
    </div>

    <script src="/static/game/script.js"></script>
</body>
</html>
